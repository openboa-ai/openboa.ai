name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Check responsive composition
        run: pnpm test:responsive

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Start production server
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/openboa-next.log 2>&1 &
          echo $! > /tmp/openboa-next.pid

      - name: Wait for production server
        run: curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/ > /dev/null

      - name: Check security headers
        run: pnpm test:security

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/openboa-next.pid ]; then
            kill "$(cat /tmp/openboa-next.pid)" 2>/dev/null || true
          fi
